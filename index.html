<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Snake Puzzle – Rohr-Rätsel</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">

  <section id="screen-menu" class="screen">
    <h1 class="title">🐍 Snake Puzzle</h1>
    <p class="subtitle">Lenke die Schlange Schritt für Schritt durch ein festes Holzrohr, weiche Stacheln, Sägeblättern und Steinen aus und erreiche das Ziel.</p>
    <div class="menu-buttons">
      <button id="btn-continue" class="btn btn-primary">Weiterspielen</button>
      <button id="btn-levels" class="btn">Level-Auswahl</button>
    </div>
  </section>

  <section id="screen-levels" class="screen hidden">
    <h2>Level-Auswahl</h2>
    <div id="level-grid" class="level-grid"></div>
    <button id="btn-back-menu" class="btn btn-ghost">Zurück</button>
  </section>

  <section id="screen-game" class="screen hidden">
    <header class="hud">
      <div class="hud-group">
        <button id="btn-undo" class="icon-btn" aria-label="Zug zurücknehmen" title="Zurück">↺</button>
        <button id="btn-skip" class="icon-btn" aria-label="Level überspringen" title="Überspringen">⏭</button>
        <button id="btn-hint" class="icon-btn" aria-label="Hinweis" title="Hinweis">💡</button>
      </div>
      <div class="hud-level-pill" id="hud-level-name">Level 1</div>
      <div class="hud-group">
        <button id="btn-pause" class="icon-btn" aria-label="Menü">⚙</button>
      </div>
    </header>

    <p id="level-subtitle" class="level-subtitle"></p>

    <div class="stage">
      <div class="canvas-wrap">
        <canvas id="game-canvas"></canvas>

        <div id="overlay-pause" class="overlay hidden">
          <div class="overlay-card">
            <h3>Pause</h3>
            <button id="btn-resume" class="btn btn-primary">Fortsetzen</button>
            <button id="btn-restart-pause" class="btn">Level neu starten</button>
            <button id="btn-menu-pause" class="btn btn-ghost">Level-Auswahl</button>
          </div>
        </div>

        <div id="overlay-win" class="overlay hidden">
          <div class="overlay-card">
            <div class="banner banner-win">GESCHAFFT!</div>
            <div id="win-stars" class="stars"></div>
            <button id="btn-next-level" class="btn btn-primary">Nächstes Level</button>
            <button id="btn-menu-win" class="btn btn-ghost">Level-Auswahl</button>
          </div>
        </div>

        <div id="overlay-fail" class="overlay hidden">
          <div class="overlay-card">
            <div class="banner banner-fail">FAILED!</div>
            <div class="fail-face">😢</div>
            <div class="fail-buttons">
              <button id="btn-retry" class="btn btn-primary">↺ Nochmal</button>
              <button id="btn-skip-fail" class="btn btn-accent">⏭ Überspringen</button>
            </div>
            <button id="btn-menu-fail" class="btn btn-ghost">Level-Auswahl</button>
          </div>
        </div>
      </div>

      <div class="dpad-wrap" id="touch-controls">
        <button data-dir="UP" class="dpad dpad-up" aria-label="Hoch">▲</button>
        <button data-dir="LEFT" class="dpad dpad-left" aria-label="Links">◀</button>
        <button data-dir="RIGHT" class="dpad dpad-right" aria-label="Rechts">▶</button>
        <button data-dir="DOWN" class="dpad dpad-down" aria-label="Runter">▼</button>
      </div>
    </div>

    <button id="btn-exit" class="exit-btn" aria-label="Verlassen">✕</button>
  </section>

</div>
<script src="js/sim.js"></script>
<script src="js/levels.js"></script>
<script src="js/game.js"></script>
</body>
</html>
